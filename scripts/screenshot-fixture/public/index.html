<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Weather</title>
<style>
	body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: #1f2933; background: #f4f7fb; }
	header { padding: 10px 28px; background: #2f6fde; color: #fff; font-size: 16px; font-weight: 600; }
	main { padding: 18px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
	h1 { margin: 0; font-size: 24px; }
	.now { color: #52606d; }
	.big { font-size: 48px; font-weight: 700; line-height: 1.1; margin-top: 6px; }
	.hours { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
	.hour { background: #fff; border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 1px 3px #0001; }
	.hour b { display: block; font-size: 20px; }
	.hour span { color: #52606d; font-size: 12px; }
	.chart { background: #fff; border-radius: 10px; padding: 10px 14px; box-shadow: 0 1px 3px #0001; }
	.chart span { color: #52606d; font-size: 12px; }
</style>
</head>
<body>
<header>Weather</header>
<main>
	<div>
		<h1>Lisbon</h1>
		<div class="now">Partly cloudy</div>
		<div class="big">19 °C</div>
	</div>
	<div class="chart">
		<span>Next 24 hours</span>
		<svg viewBox="0 0 300 80" width="100%" height="80">
			<path d="M0 60 L25 56 L50 50 L75 40 L100 30 L125 24 L150 22 L175 26 L200 36 L225 46 L250 52 L275 56 L300 58 L300 80 L0 80 Z" fill="#2f6fde22"/>
			<path d="M0 60 L25 56 L50 50 L75 40 L100 30 L125 24 L150 22 L175 26 L200 36 L225 46 L250 52 L275 56 L300 58" fill="none" stroke="#2f6fde" stroke-width="2.5"/>
		</svg>
	</div>
	<div class="hours">
		<div class="hour"><span>09:00</span><b>17°</b></div>
		<div class="hour"><span>10:00</span><b>18°</b></div>
		<div class="hour"><span>11:00</span><b>19°</b></div>
		<div class="hour"><span>12:00</span><b>21°</b></div>
		<div class="hour"><span>13:00</span><b>22°</b></div>
		<div class="hour"><span>14:00</span><b>22°</b></div>
	</div>
</main>
</body>
</html>
