name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # The Node line of VS Code 1.138's extension host. It runs the .ts files by type stripping, as the extension does.
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code # Validating needs no sign-in.
      - name: Validate the Claude Code plugin and its marketplace
        run: claude plugin validate --strict plugin && claude plugin validate --strict .
      - run: node test/docker.ts
      - run: npm run check-screenshots

      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs
          path: .vscode-test/docker/
          include-hidden-files: true # The folder is under .vscode-test, which upload-artifact skips by default as hidden.
          if-no-files-found: ignore

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release # Two quick pushes to main must not race on the same tag.
    steps:
      - uses: actions/checkout@v7

      - name: Stop when the tag exists
        id: tag
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "v$version exists: nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tag.outputs.exists != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: steps.tag.outputs.exists != 'true'
        name: Build the VSIX and the release notes
        run: |
          npm ci
          npm run package
          # The top CHANGELOG.md section, without its heading: the release title is the version.
          awk '/^## \[/ { if (found) exit; found = 1; next } found' CHANGELOG.md | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' | sed '1{/^$/d}' > notes.md
          test -s notes.md

      - if: steps.tag.outputs.exists != 'true'
        name: Create the tag and the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: gh release create "v$VERSION" ./*.vsix --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
